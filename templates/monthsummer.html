<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Month - Beach Sand Theme</title>
    <style>
        body {
            background: linear-gradient(to bottom, #f4e4c3, #e0c9a6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }
        .beach-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 30px;
            opacity: 0.8;
        }
        .sun-sticker {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 30px;
            opacity: 0.8;
        }
        .container {
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.15);
            width: 80%;
        }
        h1 {
            color: #5d4037;
            font-size: 34px;
        }
        .month-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .month-button {
            background: linear-gradient(135deg, #8ecae6, #219ebc);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.3s ease;
        }
        .month-button:hover {
            background: linear-gradient(135deg, #219ebc, #8ecae6);
            transform: scale(1.1);
        }
        .back-button {
    position: fixed;
    top: 50px;
    left: 30px;
    z-index: 9999;

    font-size: 20px;
    text-decoration: none;
    color: #000;
}

.logout-button {
    position: fixed;
    top: 50px;
    right: 30px;
    z-index: 9999;

    font-size: 20px;
    text-decoration: none;
    color: #000;
}
    
/* Fixed navigation buttons */
.nav-back, .nav-logout {
    position: fixed;
    top: 50px;
    z-index: 99999;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(255,255,255,0.92);
    color: #000;
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
    box-shadow: 0 3px 12px rgba(0,0,0,0.18);
}
.nav-back { left: 20px; }
.nav-logout { right: 20px; }
.nav-back:hover, .nav-logout:hover {
    transform: translateY(-1px);
    opacity: 0.9;
}
    </style>
</head>
<body>
    <a href="javascript:history.back()" class="nav-back">← Back</a>
    <a href="{{ url_for('logout') }}" class="nav-logout">Logout</a>
    <div class="beach-icon">🏝️</div>
    <div class="sun-sticker">☀️</div>
    <script>
        function selectMonth(month) {
            localStorage.setItem('selectedMonth', month);
            window.location.href = 'daysummer.html';
        }
    </script>
    <div class="container">
        <h1>Select a Month</h1>
        <div class="month-list">
            <script>
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                for (let i = 0; i < months.length; i++) {
                    document.write(`<button class="month-button" onclick="selectMonth('${months[i]}')">${months[i]}</button>`);
                }
            </script>
        </div>
    </div>
</body>
</html>
