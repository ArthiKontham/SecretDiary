<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Year - Winter Theme</title>
    <style>
        body {
            background: linear-gradient(to bottom, #0a529a, #347ec9); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: #2f4f7f; 
        }

        .container {
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
        }

        .year-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .year-button {
            background: linear-gradient(135deg, #92bce0, #608bb4); 
            padding: 15px 25px;
            font-size: 18px;
            color: white;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.2);
        }

        .year-button:hover {
            background: linear-gradient(135deg, #608bb4, #92bce0);
            transform: scale(1.1);
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1em;
            opacity: 0.8;
            animation: fall linear infinite;

        .back-button {
    position: fixed;
    top: 50px;
    left: 30px;
    z-index: 9999;

    font-size: 20px;
    text-decoration: none;
    color: #000;
}

.logout-button {
    position: fixed;
    top: 50px;
    right: 30px;
    z-index: 9999;

    font-size: 20px;
    text-decoration: none;
    color: #000;
}
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    
/* Fixed navigation buttons */
.nav-back, .nav-logout {
    position: fixed;
    top: 20px;
    z-index: 99999;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(255,255,255,0.92);
    color: #000;
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
    box-shadow: 0 3px 12px rgba(0,0,0,0.18);
}
.nav-back { left: 20px; }
.nav-logout { right: 20px; }
.nav-back:hover, .nav-logout:hover {
    transform: translateY(-1px);
    opacity: 0.9;
}
    </style>
</head>
<body>
    <a href="javascript:history.back()" class="nav-back">← Back</a>
    <a href="{{ url_for('logout') }}" class="nav-logout">Logout</a>
    <div class="container">
        <h1>Select a Year</h1>
        <div class="year-list">

            <script>
                const currentYear = new Date().getFullYear();
                for (let i = currentYear - 10; i <= currentYear + 10; i++) {
                    document.write(`<button class="year-button" onclick="selectYear(${i})">${i}</button>`);
                }
            </script>
        </div>
    </div>

    <script>
        function createSnowflakes() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.textContent = '❄'; 
            snowflake.style.left = `${Math.random() * 100}vw`;
            snowflake.style.animationDuration = `${3 + Math.random() * 5}s`;
            snowflake.style.fontSize = `${10 + Math.random() * 20}px`;
            document.body.appendChild(snowflake);
            setTimeout(() => snowflake.remove(), 8000);
        }

        setInterval(createSnowflakes, 200); 

        function selectYear(year) {
            localStorage.setItem('selectedYear', year);
            window.location.href = 'monthwinter.html'; 
        }
    </script>
</body>
</html>
