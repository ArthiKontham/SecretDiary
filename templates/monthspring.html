<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Month - Spring Theme</title>
    <style>
        body {
            background: linear-gradient(to bottom, #b3e5fc, #81d4fa);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .container {
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 34px;
            color: #006064;
            margin-bottom: 30px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
        }

        .month-button {
            background: linear-gradient(135deg, #81c784, #66bb6a);
            padding: 15px 30px;
            font-size: 20px;
            color: white;
            border-radius: 10px;
            border: none;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.2);
        }

        .month-button:hover {
            background: linear-gradient(135deg, #66bb6a, #81c784);
            transform: scale(1.1);
        }


        .leaf {
            position: absolute;
            top: -10px;
            color: #388e3c;
            font-size: 1em;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        .back-button {
    position: fixed;
    top: 25px;
    left: 30px;
    z-index: 9999;

    font-size: 20px;
    text-decoration: none;
    color: #000;
}

.logout-button {
    position: fixed;
    top: 25px;
    right: 30px;
    z-index: 9999;

    font-size: 20px;
    text-decoration: none;
    color: #000;
}
    
/* Fixed navigation buttons */
.nav-back, .nav-logout {
    position: fixed;
    top: 20px;
    z-index: 99999;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(255,255,255,0.92);
    color: #000;
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
    box-shadow: 0 3px 12px rgba(0,0,0,0.18);
}
.nav-back { left: 20px; }
.nav-logout { right: 20px; }
.nav-back:hover, .nav-logout:hover {
    transform: translateY(-1px);
    opacity: 0.9;
}
    </style>
</head>
<body>
    <a href="javascript:history.back()" class="nav-back">← Back</a>
    <a href="{{ url_for('logout') }}" class="nav-logout">Logout</a>
    <div class="container">
        <h1>Select a Month</h1>
        <button class="month-button" onclick="selectMonth('January')">January</button>
        <button class="month-button" onclick="selectMonth('February')">February</button>
        <button class="month-button" onclick="selectMonth('March')">March</button>
        <button class="month-button" onclick="selectMonth('April')">April</button>
        <button class="month-button" onclick="selectMonth('May')">May</button>
        <button class="month-button" onclick="selectMonth('June')">June</button>
        <button class="month-button" onclick="selectMonth('July')">July</button>
        <button class="month-button" onclick="selectMonth('August')">August</button>
        <button class="month-button" onclick="selectMonth('September')">September</button>
        <button class="month-button" onclick="selectMonth('October')">October</button>
        <button class="month-button" onclick="selectMonth('November')">November</button>
        <button class="month-button" onclick="selectMonth('December')">December</button>
    </div>

    <script>
        function createFallingLeaves() {
            const leaf = document.createElement('div');
            leaf.classList.add('leaf');
            leaf.textContent = '🍃'; 
            leaf.style.left = `${Math.random() * 100}vw`;
            leaf.style.animationDuration = `${3 + Math.random() * 5}s`;
            leaf.style.fontSize = `${10 + Math.random() * 20}px`;
            document.body.appendChild(leaf);
            setTimeout(() => leaf.remove(), 8000);
        }

        setInterval(createFallingLeaves, 200);

        function selectMonth(month) {
            localStorage.setItem('selectedMonth', month);
            window.location.href = 'dayspring.html';
        }
    </script>
</body>
</html>
