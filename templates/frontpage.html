<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secret Diary - Front Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: url('https://png.pngtree.com/thumb_back/fw800/background/20230512/pngtree-open-diary-with-fountain-pen-image_2506780.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            z-index: 1;
        }

        .header {
            font-size: 3rem;
            color: #fff;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 50px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .signup-btn, .login-btn {
            background-color: #b68e52;
            color: white;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
        }

        .signup-btn:hover, .login-btn:hover {
            background-color: #9e7b42;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .container p {
            color: #fff;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="overlay"></div> 
<div class="container">
    <div class="header">
        Secret Diary
    </div>
    <p>Where your thoughts are safe and your dreams take shape</p>
    <div class="btn-container">
        <a href="{{ url_for('signup') }}">
            <button class="signup-btn">Sign Up</button>
        </a>
        <a href="{{ url_for('login') }}">
            <button class="login-btn">Login</button>
        </a>
    </div>
</div>

</body>
</html>
