<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secret Diary - Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0e1c6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff8e1;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #b68e52;
            font-size: 28px;
            margin-bottom: 20px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #c5a780;
            border-radius: 5px;
            font-size: 16px;
            background-color: #fff3d1;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #b68e52;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #9e7b42;
        }
        .links {
            margin-top: 15px;
            font-size: 14px;
        }
        .links a {
            color: #b68e52;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .back-button {
    position: fixed;
    top: 25px;
    left: 30px;
    z-index: 9999;

    font-size: 20px;
    text-decoration: none;
    color: #000;
}

.logout-button {
    position: fixed;
    top: 25px;
    right: 30px;
    z-index: 9999;

    font-size: 20px;
    text-decoration: none;
    color: #000;
}
    </style>
</head>
<body>

<div style="position:fixed;top:50px;left:20px;"><a href="/" style="background:#8d6e63;color:white;padding:9px 15px;border-radius:9px;text-decoration:none;">← Back</a></div>
<div class="container">
    <h1>Sign Up for Secret Diary</h1>
    <form action="{{ url_for('signupsuccess') }}" method="post" id="signupForm">
<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" minlength="6" required>

<input type="password" name="confirmPassword" placeholder="Confirm Password" minlength="6" required>

        <small>Password must be at least 6 characters.</small>
        <button type="submit">Sign Up</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <p class="links">Already have an account? <a href="{{ url_for('login') }}">Sign In</a></p>
</div>
<script>
    document.getElementById("signupForm").addEventListener("submit", function(e) {
        const pw = document.querySelector('input[name="password"]').value;
        const cpw = document.querySelector('input[name="confirmPassword"]').value;
        if (pw !== cpw) {
            alert("Passwords do not match!");
            e.preventDefault();
        }
    });
</script>
</body>
</html>
